stages:
  - build

container-image-dev:
  services:
    - docker:20.10.15-dind-alpine3.15
  image: docker:20.10.15-alpine3.15
  stage: build
  before_script:
    - apk add --no-cache docker-cli-buildx
    - docker buildx create --use 
  script:
    - |-
      if [ "${CI_COMMIT_BRANCH}" == "master-2.0" ]; then
        echo "${DOCKER_SECRET}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
      else
        echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USER}" --password-stdin
      fi

    - >-
      docker buildx build
      --platform linux/amd64
      --file=Dockerfile
      --target=run
      --load
      -t run
      .

    - |-
      IMAGE_VERSION="$(date +%Y%m%d)-${CI_COMMIT_SHORT_SHA}"
      if [ "${CI_COMMIT_BRANCH}" == "master-2.0" ]; then
        docker tag run omnileads/kamailio:$IMAGE_VERSION
        docker push docker.io/omnileads/kamailio:$IMAGE_VERSION
      else
        docker tag run freetechsolutions/kamailio:$IMAGE_VERSION
        docker push docker.io/freetechsolutions/kamailio:$IMAGE_VERSION
      fi  
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master-2.0"'
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop-2.0"'
    - if: '$CI_COMMIT_REF_NAME =~ /build/'
    - if: '$CI_PIPELINE_SOURCE == "web"'