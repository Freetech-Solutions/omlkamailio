- name: Kamailio installation and configuration
  hosts: prodenv-aio
  vars:
    install_prefix: /opt/omnileads
    packages_url: https://fts-public-packages.s3.amazonaws.com
    kamailio_package: "{{ packages_url }}/kamailio/kamailio_{{ kamailio_version }}_amd64.deb"
    kamailio_location: "{{ install_prefix }}/kamailio"
    certs_location: "/usr/src/omlkamailio/deploy/certs/"
    debian_version: "bullseye"
  tasks:

    # Environment variables setting
    - name: Setting of environment variables
      copy:
        dest: "/etc/default/omnileads_envars.sh"
        content: |
          KAMAILIO_HOSTNAME={{ kamailio_hostname }}
          KAMAILIO_CERTS_LOCATION={{ certs_location }}
          ASTERISK_HOSTNAME={{ asterisk_hostname }}
          REDIS_HOSTNAME={{ redis_hostname }}
          RTPENGINE_HOSTNAME={{ rtpengine_hostname }}
          SHM_SIZE={{ shm_size }}
          PKG_SIZE={{ pkg_size }}

          export KAMAILIO_HOSTNAME KAMAILIO_CERTS_LOCATION ASTERISK_HOSTNAME REDIS_HOSTNAME RTPENGINE_HOSTNAME SHM_SIZE PKG_SIZE

      # Add an Apt signing key, uses whichever key is at the URL
    - apt_key:
        url: "http://deb.kamailio.org/kamailiodebkey.gpg"
        state: present

    - name: Add specified repository into sources list
      apt_repository:
        repo: deb http://deb.kamailio.org/kamailio56 bullseye main
        state: present

    - name: Apt update
      command: apt update

    - name: Install Kamailio dependencies
      apt:
        name:
          - libhiredis-dev
          - uuid-dev
          - net-tools
          - sngrep
          - kamailio
          - kamailio-python3-modules
          - kamailio-autheph-modules
          - kamailio-redis-modules
          - kamailio-outbound-modules
          - kamailio-tls-modules
          - kamailio-extra-modules
          - kamailio-websocket-modules
        state: present

    - name: Copy kamailio.cfg
      copy:
        src: ../source/conf/kamailio.cfg
        dest: /etc/kamailio

    # - name: Modify kamailio.service
    #   lineinfile:
    #     dest: '/etc/systemd/system/multi-user.target.wants/kamailio.service'
    #     regexp: '{{ item.regexp }}'
    #     line: '{{ item.line }}'
    #   loop:
    #     - { regexp: "^#listen_addresses", line: "listen_addresses = '*'" }
    #     - { regexp: "^#archive_mode", line: "archive_mode = 'on'" }
    #     - { regexp: "^#archive_command", line: "archive_command = 'test ! -f /var/lib/pgsql/archivelog/%f && cp %p /var/lib/pgsql/archivelog/%f'" }
    #     - { regexp: "^#hot_standby", line: "hot_standby = on" }
    #     - { regexp: "^#shared_preload_libraries", line: "shared_preload_libraries = 'repmgr'"}
    #   when: deploy_ha is defined

    # Kamailio restart
    - name: Restart kamailio service
      systemd:
        name: kamailio
        state: restarted
        enabled: yes
        daemon_reload: yes
      tags: always
