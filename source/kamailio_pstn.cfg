#!KAMAILIO
#
# SIP Edge Proxy single-tenant
# - Outbound (Asterisk -> ITSP): por Route header (outbound_proxy en Asterisk)
# - Inbound  (ITSP -> Asterisk): siempre hacia un único dispatcher group
# - Outbound hacia PSTN: enmascara Topología con módulo TOPOH
# - RTPengine para SDP
#
# FIXES aplicados (2026-06-20):
#   [F1] OUTBOUND_RESOLVE_ROUTE: inicializar $var(route2)="" y guard $(hdr(Route)[cnt])>1
#        para evitar lval_assign error y contaminación de proceso entre requests.
#   [F2] OUTBOUND_MASK: agregar has_totag() check antes de uac_replace_from() para
#        evitar errores "multiple times" en BYE y "decline sequential" en ACK.
#   [F3] OUTBOUND_MASK: evaluar retorno de uac_replace_from() antes de logear éxito.
#   [F4] request_route: eliminar rtpengine_delete() en bloque BYE antes de has_totag()
#        (doble delete — BYE siempre tiene To-tag, lo maneja WITHINDLG).
#   [F5] request_route: agregar exit a t_check_trans() para descartar retransmisiones.
#   [F6] DISPATCH_FAILURE: agregar retry con ds_next_dst() y respuesta 503 final.
#   [F7] OUTBOUND_RESOLVE_ROUTE: validar $var(route_uri_temp) antes de usarlo como $du.
#   [F9] OUTBOUND_MASK: eliminar fix_nated_register() en outbound REGISTER; reutilizar
#        reescritura de Contact con IP pública (misma lógica que INVITE) y return temprano.
#   [F10] request_route: eliminar $ru = $var(route_uri_temp) — el proxy no debe alterar
#         el Request-URI; solo $du define el destino next-hop (Loose Routing multi-hop).
#   [F11] Outbound INVITE: record_route_advertised_address() en lugar de record_route()
#         (misma lógica que inbound) para que BYE/re-INVITE del carrier usen la IP pública.
#   [F12] WITHINDLG: log detallado cuando loose_route() falla (diagnóstico BYE 404).
#   [F13] WITHINDLG: socket de salida según origen (ITSP→privado hacia ACD, PBX→público hacia carrier).
#   [F14] OUTBOUND_MASK: reescribir Contact en INVITE inicial (ITSP no debe ver IP privada de Asterisk).
#   [F15] WITHINDLG: BYE/UPDATE del ITSP con destino privado → dispatcher ACD (no al Contact obsoleto).
#   [F16] OUTBOUND_SANITIZE: From/Contact→IP pública ANTES de rtpengine (evita doble uac_replace_from en RELAY).
#   [F17] WITHINDLG_ROUTE_TO_ACD: si tras loose_route el destino es nosotros (Contact=IP pública), relay al ACD.
#   [F18] WITHINDLG: ACD redirect solo para tráfico entrante del carrier, nunca ACK/BYE del PBX hacia afuera.
#   [F19] IS_FROM_PBX vs IS_OUTBOUND_PSTN: gateways fuera de ITSP_NODES ya no se saltan WITHINDLG_ROUTE_TO_ACD.
#

#!substdef "!MY_IP_ADDR_PUBLIC!$env(IPADDR_PUBLIC)!g"
#!substdef "!MY_IP_ADDR_PRIVATE!$env(IPADDR_PRIVATE)!g"
#!substdef "!MY_FQDN!$env(FQDN)!g"
#!substdef "!RTPENGINE_SOCKET!$env(RTPENGINE_SOCKET)!g"
#!substdef "!MY_UDP_PORT!5060!g"

#!substdef "!MY_UDP_PUBLIC_ADDR!udp:MY_IP_ADDR_PUBLIC:MY_UDP_PORT!g"
#!substdef "!MY_UDP_PRIVATE_ADDR!udp:MY_IP_ADDR_PRIVATE:MY_UDP_PORT!g"

#!define WITH_NAT
#!define WITH_RTPENGINE
#!define WITH_PROMETHEUS
# WITH_TOPOH deshabilitado: el módulo topoh intercepta el INVITE saliente de
# Asterisk antes del routing script y hace strict-route swap sobre el
# outbound_proxy Route (<sip:10.10.0.14;lr>), corrompiendo RURI y Route y
# generando un TH:dih inválido que rompe el path de respuesta del carrier.
# La versión instalada de Kamailio no soporta el parámetro ignore_address.
# Reemplazado por record_route_advertised_address() para topology hiding manual.
##!define WITH_TOPOH
#!define FLB_HOMER 24

#!substdef "!HOMER_CAPTURE_HOST!$env(HOMER_HOST)!g"
#!substdef "!HOMER_CAPTURE_PORT!$env(HOMER_PORT)!g"
#!substdef "!HOMER_CAPTURE_ID!$env(HOMER_CAPTURE_ID)!g"

####### Global Parameters #########
debug=2
log_stderror=yes
log_facility=LOG_LOCAL0
fork=no
children=4
alias=MY_FQDN
tcp_connection_lifetime=300
force_rport=yes
mhomed=yes

#!ifdef WITH_PROMETHEUS
tcp_accept_no_cl=yes
#!endif

####### Listen Address #########
listen=udp:MY_IP_ADDR_PUBLIC:MY_UDP_PORT advertise MY_IP_ADDR_PUBLIC:MY_UDP_PORT
listen=MY_UDP_PRIVATE_ADDR
listen=tcp:MY_IP_ADDR_PRIVATE:9273

####### Modules Section #########
loadmodule "tm.so"
loadmodule "sl.so"

loadmodule "siputils.so"
loadmodule "rr.so"
loadmodule "path.so"

loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "xlog.so"
loadmodule "sanity.so"

loadmodule "textops.so"
loadmodule "uac.so"
loadmodule "rtpengine.so"
loadmodule "nathelper.so"
loadmodule "dispatcher.so"
loadmodule "ipops.so"

#!ifdef WITH_TOPOH
loadmodule "topoh.so"
#!endif

#!ifdef WITH_PROMETHEUS
loadmodule "kex.so"
loadmodule "xhttp.so"
loadmodule "xhttp_prom.so"
modparam("xhttp_prom", "xhttp_prom_stats", "all")
modparam("xhttp_prom", "xhttp_prom_pkg_stats", 1)
#!endif

#!ifdef WITH_HOMER
loadmodule "siptrace.so"

modparam("siptrace", "trace_to_database", 0)
modparam("siptrace", "duplicate_uri", "sip:HOMER_CAPTURE_HOST:HOMER_CAPTURE_PORT")
modparam("siptrace", "trace_on", 1)
modparam("siptrace", "trace_flag", FLB_HOMER)
modparam("siptrace", "hep_mode_on", 1)
modparam("siptrace", "hep_version", 3)
modparam("siptrace", "hep_capture_id", HOMER_CAPTURE_ID)
#!endif

####### Module Parameters ########
modparam("rtpengine", "rtpengine_sock", "RTPENGINE_SOCKET")

modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_interval", 20)
modparam("dispatcher", "ds_ping_reply_codes", "class=2;code=480;code=486")

# NAT helper
modparam("nathelper", "received_avp", "$avp(RECEIVED)")

#!ifdef WITH_TOPOH
# Topology Hiding — clave pasada como variable de entorno desde el Podman Quadlet
modparam("topoh", "mask_key", "$env(TOPOH_MASK_KEY)")
modparam("topoh", "mask_ip", "MY_IP_ADDR_PUBLIC")
modparam("topoh", "mask_callid", 1)
#!endif

####### Helper Routes #########

# Extrae DID para inbound (ITSP -> Kamailio -> Asterisk)
route[GET_DID_INBOUND] {
    $var(did) = $rU;
    if ($var(did) == "") $var(did) = $tU;

    if ($var(did) == "") {
        xlog("L_ERR", "INBOUND: DID vacío. rU='$rU' tU='$tU' Call-ID=$ci\n");
        return -1;
    }

    xlog("L_INFO", "INBOUND: DID='$var(did)'\n");
    return 1;
}

# Tráfico Asterisk/backbone hacia carrier (no inbound ITSP)
route[IS_OUTBOUND_PSTN] {
    if (route(IS_FROM_ITSP)) return -1;
    return 1;
}

# Asterisk/ACD (PBX) — distinto de gateways/carriers no listados en ITSP_NODES.
# [F19] Usar esto en WITHINDLG; IS_OUTBOUND_PSTN=true también para 35.244.x fuera del allowlist.
route[IS_FROM_PBX] {
    if ($si == "10.10.0.18") return 1;
    return -1;
}

# Socket público
route[OUTBOUND_EGRESS] {
    if (route(IS_OUTBOUND_PSTN) < 0) return;
    force_send_socket(udp:MY_IP_ADDR_PUBLIC:MY_UDP_PORT);
    return;
}

# Enmascaramiento outbound: From/Contact con IP pública antes de salir al carrier.
# [F16] Se invoca en request_route (previo a rtpengine), NO en RELAY — uac_replace_from()
#       falla con "multiple times" si se ejecuta dos veces en el mismo INVITE.
route[OUTBOUND_SANITIZE] {
    if (route(IS_OUTBOUND_PSTN) < 0) return;
    if (!is_method("INVITE") || has_totag()) return;

    if (is_present_hf("OMniLeadsOutbound")) {
        remove_hf("OMniLeadsOutbound");
        xlog("L_INFO", "OUTBOUND_SANITIZE: Cabecera OMniLeadsOutbound eliminada\n");
    }

    if ($fU != $null && $fU != "") {
        $var(pub_user) = $fU;
    } else {
        $var(pub_user) = "oml";
    }

    remove_hf("Contact");
    insert_hf("Contact: <sip:$var(pub_user)@MY_IP_ADDR_PUBLIC:MY_UDP_PORT>\r\n", "Call-ID");

    if (!uac_replace_from("", "sip:" + $var(pub_user) + "@MY_IP_ADDR_PUBLIC")) {
        remove_hf("From");
        insert_hf("From: <sip:$var(pub_user)@MY_IP_ADDR_PUBLIC>;tag=$ft\r\n", "To");
        xlog("L_WARN", "OUTBOUND_SANITIZE: uac_replace_from falló, From reescrito manual tag=$ft\n");
    }

    xlog("L_INFO", "OUTBOUND_SANITIZE: From/Contact -> $var(pub_user)@MY_IP_ADDR_PUBLIC Call-ID=$ci\n");
    return;
}

# Enmascaramiento en RELAY: REGISTER y strip de cabeceras internas en in-dialog.
route[OUTBOUND_MASK] {
    route(OUTBOUND_EGRESS);
    if (route(IS_OUTBOUND_PSTN) < 0) return;

    if (is_present_hf("OMniLeadsOutbound")) {
        remove_hf("OMniLeadsOutbound");
        xlog("L_INFO", "OUTBOUND_MASK: Cabecera OMniLeadsOutbound eliminada\n");
    }

    if (is_method("REGISTER")) {
        remove_hf("Contact");
        if ($fU != $null && $fU != "") {
            insert_hf("Contact: <sip:$fU@MY_IP_ADDR_PUBLIC:MY_UDP_PORT>\r\n", "Call-ID");
        } else {
            insert_hf("Contact: <sip:oml@MY_IP_ADDR_PUBLIC:MY_UDP_PORT>\r\n", "Call-ID");
        }
        xlog("L_INFO", "OUTBOUND_MASK: Contact reescrito para REGISTER -> $fU@MY_IP_ADDR_PUBLIC\n");
    }
    return;
}

# Resuelve destino outbound desde Route header
# [F1] $var(route2) se inicializa a "" antes del acceso indexado para evitar
#      lval_assign error cuando existe un solo Route header, y para prevenir
#      contaminación entre requests del mismo proceso worker ($var son per-process).
route[OUTBOUND_RESOLVE_ROUTE] {
    if (!is_present_hf("Route")) return;

    $var(route1) = $(hdr(Route){re.subst,/<([^>]+)>.*/\1/});

    # [F1] Inicializar SIEMPRE antes del acceso indexado [1].
    $var(route2) = "";
    if ($hdrc(Route) > 1) {
        $var(route2) = $(hdr(Route)[1]{re.subst,/<([^>]+)>.*/\1/});
    }

    if ($var(route2) != $null && $var(route2) != "") {
        if (is_myself($var(route1))) {
            $var(route_uri_temp) = $var(route2);
            xlog("L_INFO", "OUTBOUND_ROUTE: proxy en 1er Route, destino='$var(route_uri_temp)'\n");
        } else {
            $var(route_uri_temp) = $var(route1);
        }
    } else {
        # === INICIO DEL CÓDIGO CORREGIDO ===
        if (is_myself($var(route1))) {
            # Extraemos el destino directamente del Request-URI ($ru) 
            # Esto preserva el puerto (ej. 5070) y cualquier parámetro SIP extra
            $var(route_uri_temp) = $ru;
            
            xlog("L_INFO", "OUTBOUND_ROUTE: solo Route proxy, destino desde RURI='$var(route_uri_temp)'\n");
        } else {
            $var(route_uri_temp) = $var(route1);
        }
        # === FIN DEL CÓDIGO CORREGIDO ===
    }
    return;
}

# NAT detection
route[NATDETECT] {
#!ifdef WITH_NAT
    if (route(IS_OUTBOUND_PSTN) > 0) return;

    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else {
            if (is_first_hop()) {
                set_contact_alias();
            }
        }
    }
#!endif
    return;
}

####### Routing Logic #########
include_file "/etc/kamailio/itsp_allowlist.cfg"

request_route {
    xlog("L_INFO", "============= INICIO DE PROCESAMIENTO ============\n");
    xlog("L_INFO", "Método: $rm, Source: $si:$sp, Destino: $ru, Call-ID: $ci\n");

    route(REQINIT);

#!ifdef WITH_HOMER
    if (!is_method("OPTIONS")) {
        setflag(FLB_HOMER);
        if ($env(HOMER_NODE_NAME) != $null && $env(HOMER_NODE_NAME) != "") {
            sip_trace("", "$env(HOMER_NODE_NAME)");
        } else {
            sip_trace();
        }
    }
#!endif

    route(NATDETECT);

    # CANCEL
    if (is_method("CANCEL")) {
        xlog("L_INFO", "Procesando CANCEL\n");
        if (t_check_trans()) route(RELAY);
        exit;
    }

    # [F4] El BYE SIEMPRE tiene To-tag → siempre cae en WITHINDLG.
    #      El bloque BYE/rtpengine_delete que estaba aquí causaba un doble delete:
    #      una vez aquí y otra en WITHINDLG. Se eliminó — WITHINDLG lo maneja solo.
    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    # [F5] Descartar retransmisiones de requests sin To-tag (ej. INVITE retransmitido).
    #      Antes: t_check_trans() sin exit → el script continuaba procesando.
    if (t_check_trans()) exit;

    # ==========================================================
    # DISCRIMINACIÓN INBOUND/OUTBOUND
    # ==========================================================
    if (is_method("INVITE")) {
        if (is_present_hf("OMniLeadsOutbound")) {
            xlog("L_INFO", "Outbound INVITE detectado (OMniLeadsOutbound presente)\n");
        } else {
            xlog("L_INFO", "Inbound INVITE detectado (OMniLeadsOutbound ausente)\n");
            route(INBOUND_DISPATCH_FIXED);
            exit;
        }
    }

    if (is_method("REGISTER") && !is_present_hf("OMniLeadsOutbound")) {
        xlog("L_INFO", "REGISTER sin OMniLeadsOutbound: asumiendo outbound\n");
    }

    # ==========================================================
    # OUTBOUND: request inicial
    # ==========================================================
    if (@via[2] == "") {
        xlog("L_INFO", "Solicitud inicial: $rm de $si:$sp hacia $ru\n");

        if (is_present_hf("Route")) {
            route(OUTBOUND_RESOLVE_ROUTE);

            # [F7] Validar que se resolvió un destino antes de usarlo
            if ($var(route_uri_temp) == $null || $var(route_uri_temp) == "") {
                xlog("L_ERR", "OUTBOUND_RESOLVE_ROUTE: destino vacío. Call-ID=$ci\n");
                sl_send_reply("500", "Internal Routing Error");
                exit;
            }

            $du = $var(route_uri_temp);

            # [F10] $ru no se altera — Loose Routing multi-hop preserva el Request-URI original.
            if (!is_method("REGISTER")) {
                if (is_method("INVITE")) {
                    route(OUTBOUND_EGRESS);
                    record_route_advertised_address("MY_IP_ADDR_PUBLIC:MY_UDP_PORT");
                }
            }
            remove_hf("Route");
        } else {
            if (is_method("INVITE") || is_method("SUBSCRIBE")) {
                if (is_method("INVITE")) {
                    route(OUTBOUND_EGRESS);
                }
                record_route_advertised_address("MY_IP_ADDR_PUBLIC:MY_UDP_PORT");
            }

            if ($rU == $null) {
                sl_send_reply("484", "Address Incomplete");
                exit;
            }
            $du = $ru;
        }

        if (is_method("INVITE")) {
            route(OUTBOUND_SANITIZE);
        }

        if (is_method("INVITE") && has_body("application/sdp")) {
            route(RTPENGINE_OFFER);
        }

        route(RELAY);
        exit;
    }

    # ==========================================================
    # Solicitud subsecuente
    # ==========================================================
    if (!loose_route()) {
        xlog("L_ERR", "OUTBOUND_SUBSEQ: loose_route() falló method=$rm src=$si:$sp RURI=$ru Call-ID=$ci Route=$hdr(Route)\n");
        sl_send_reply("403", "Forbidden - Ruta incorrecta");
        exit;
    }

    if (is_method("INVITE") && has_body("application/sdp")) {
        route(RTPENGINE_OFFER);
    }

    t_on_failure("FAIL_OUTBOUND");
    route(RELAY);
    exit;
}

# ==========================================================
# INBOUND SINGLE-TENANT
# ==========================================================
route[INBOUND_DISPATCH_FIXED] {
    if (!route(IS_FROM_ITSP)) {
        sl_send_reply("403", "Forbidden");
        exit;
    }

    force_send_socket(udp:MY_IP_ADDR_PRIVATE:5060);

    if (route(GET_DID_INBOUND) < 0) {
        sl_send_reply("484", "Address Incomplete");
        exit;
    }

    $var(setid) = 10;
    # Sin topoh, el record_route() usaría la IP privada (MY_IP_ADDR_PRIVATE) porque
    # force_send_socket apunta al socket privado. El carrier no puede alcanzar la IP
    # privada para requests in-dialog (re-INVITE, BYE). Se anuncia explícitamente la
    # IP pública para que el carrier use el endpoint correcto.
    record_route_advertised_address("MY_IP_ADDR_PUBLIC:MY_UDP_PORT");

    if (!ds_select_dst("$var(setid)", "4")) {
        send_reply("503", "No hay destinos disponibles");
        exit;
    }

    if (has_body("application/sdp")) {
        route(RTPENGINE_OFFER);
    }

    t_on_failure("DISPATCH_FAILURE");
    route(RELAY);
    exit;
}

route[REQINIT] {
    if (!mf_process_maxfwd_header("70")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        exit;
    }

    # FIX: Interceptar OPTIONS de Asterisk y responder 200 OK localmente
    if (is_method("OPTIONS")) {
        # Si viene desde nuestra red interna (Podman/PBX) hacia afuera
        if (route(IS_OUTBOUND_PSTN) > 0) {
            xlog("L_INFO", "REQINIT: Interceptando OPTIONS de PBX y respondiendo 200 OK local\n");
            sl_send_reply("200", "OK");
            exit;
        }
        
        # Si viene de afuera hacia nosotros directamente
        if (uri == myself) {
            sl_send_reply("200", "OK");
            exit;
        }
    }
}

# [F17] Tras loose_route, el BYE del carrier puede quedar con RURI/du = nuestra IP pública
# (Contact sanitizado = Record-Route). Reenviar al ACD vía dispatcher y fijar RURI al carrier (To).
route[WITHINDLG_FIX_RURI_FOR_ACD] {
    # BYE del carrier: From=ITSP, To=nuestro Contact → Asterisk espera RURI hacia el carrier ($fu).
    if ($rm == "BYE" || $rm == "CANCEL") {
        if ($fu != $null && $fu != "") {
            $ru = $fu;
            return;
        }
    }
    if ($tu == $null || $tu == "") return;
    $ru = $tu;
    return;
}

route[WITHINDLG_NEED_ACD_DST] {
    if (is_ip_rfc1918("$rd") || $rd == "MY_IP_ADDR_PRIVATE" || is_ip_rfc1918("$(du{uri.host})")) {
        return 1;
    }
    if (is_myself("$rd") || is_myself("$(du{uri.host})") || $rd == "MY_IP_ADDR_PUBLIC") {
        return 1;
    }
    if ($rd == "MY_FQDN" || $rd == "MY_IP_ADDR_PUBLIC") {
        return 1;
    }
    return -1;
}

# [F15] Carrier → BYE con destino privado o nuestra IP pública (Contact sanitizado).
route[WITHINDLG_ROUTE_TO_ACD] {
    if (route(IS_FROM_PBX) > 0) return;
    if (route(WITHINDLG_NEED_ACD_DST) < 0) return;

    $var(setid) = 10;
    if (!ds_select_dst("$var(setid)", "4")) {
        xlog("L_ERR", "WITHINDLG_ROUTE_TO_ACD: sin ACD disponible Call-ID=$ci RURI=$ru rd=$rd du=$du\n");
        return;
    }

    route(WITHINDLG_FIX_RURI_FOR_ACD);
    xlog("L_INFO", "WITHINDLG_ROUTE_TO_ACD: $rm src=$si:$sp Call-ID=$ci RURI=$ru -> ACD $du (rd=$rd)\n");
    return;
}

route[WITHINDLG] {
    if (!has_totag()) return;

    if (!loose_route()) {
        if (is_method("ACK")) {
            if (t_check_trans()) {
                route(RELAY);
            }
            exit;
        }
        # BYE entrante (carrier o hairpin) con RURI hacia nosotros: relay al ACD.
        if (is_method("BYE") && route(IS_FROM_PBX) < 0 && route(WITHINDLG_NEED_ACD_DST) > 0) {
            $var(setid) = 10;
            if (ds_select_dst("$var(setid)", "4")) {
                route(WITHINDLG_FIX_RURI_FOR_ACD);
                xlog("L_WARN", "WITHINDLG: BYE sin loose_route, relay ACD $du RURI=$ru Call-ID=$ci\n");
                force_send_socket(udp:MY_IP_ADDR_PRIVATE:MY_UDP_PORT);
#!ifdef WITH_RTPENGINE
                rtpengine_delete();
#!endif
                route(RELAY);
                exit;
            }
        }
        xlog("L_ERR", "WITHINDLG: loose_route() falló method=$rm src=$si:$sp RURI=$ru Call-ID=$ci Route=$hdr(Route) Record-Route=$hdr(Record-Route)\n");
        sl_send_reply("404", "Not Here");
        exit;
    }

    handle_ruri_alias();

    route(WITHINDLG_ROUTE_TO_ACD);

    # [F19] PBX (10.10.0.18) → carrier: socket público. Carrier/hairpin → ACD: socket privado.
    if (route(IS_FROM_PBX) > 0) {
        force_send_socket(udp:MY_IP_ADDR_PUBLIC:MY_UDP_PORT);
        xlog("L_INFO", "WITHINDLG: $rm hacia carrier/publico du=$du RURI=$ru Call-ID=$ci\n");
    } else {
        force_send_socket(udp:MY_IP_ADDR_PRIVATE:MY_UDP_PORT);
        xlog("L_INFO", "WITHINDLG: $rm hacia ACD/privado du=$du RURI=$ru Call-ID=$ci\n");
    }

    if ($rm == "BYE") {
#!ifdef WITH_RTPENGINE
        rtpengine_delete();
#!endif
    }

    if ($rm == "INVITE" && has_body("application/sdp")) {
        route(RTPENGINE_OFFER);
    }

    route(RELAY);
    exit;
}

# [F6] DISPATCH_FAILURE ahora intenta el siguiente destino disponible (ds_next_dst)
#      antes de responder 503. Antes solo logueaba sin ninguna acción → caller colgaba.
failure_route[DISPATCH_FAILURE] {
    xlog("L_ERR", "DISPATCH_FAILURE: destino falló. RURI=$ru DU=$du Call-ID=$ci\n");
    if (t_branch_timeout() || !t_branch_replied()) {
        if (ds_next_dst()) {
            xlog("L_INFO", "DISPATCH_FAILURE: reintentando con siguiente destino DU=$du\n");
            route(RELAY);
        } else {
            xlog("L_ERR", "DISPATCH_FAILURE: sin más destinos. Respondiendo 503\n");
            t_reply("503", "Service Unavailable");
        }
    }
}

route[RTPENGINE_OFFER] {
#!ifdef WITH_RTPENGINE
    $var(reflags) = "replace-origin replace-session-connection ICE=remove RTP/AVP";
    if (route(IS_OUTBOUND_PSTN) > 0) {
        # NATDETECT no corre en outbound; forzar reescritura SDP (o=/c= con 10.89.x.x).
        $var(reflags) = $var(reflags) + " direction=both force-replace-origin force-replace-session-connection";
    } else if (nat_uac_test("8")) {
        $var(reflags) = $var(reflags) + " force-replace-origin force-replace-session-connection";
    }
    if (!rtpengine_manage("$var(reflags)")) {
        xlog("L_ERR", "RTPengine OFFER: error procesando SDP Call-ID=$ci\n");
    }
#!endif
    return;
}

route[RTPENGINE_ANSWER] {
#!ifdef WITH_RTPENGINE
    $var(reflags) = "replace-origin replace-session-connection";
    if (nat_uac_test("8")) {
        $var(reflags) = $var(reflags) + " force-replace-origin force-replace-session-connection";
    }
    if (!rtpengine_manage("$var(reflags)")) {
        xlog("L_ERR", "RTPengine ANSWER: error procesando SDP\n");
    }
#!endif
    return;
}

route[RELAY] {
    # Solo aplicamos la máscara si realmente es tráfico saliente hacia el carrier
    if (route(IS_OUTBOUND_PSTN) > 0) {
        route(OUTBOUND_MASK);
    }
    
    # NO fuerces el socket aquí. Deja que t_relay use la tabla de ruteo/dispatcher
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

failure_route[FAIL_OUTBOUND] {
    if (t_branch_timeout() || !t_branch_replied()) {
        send_reply("430", "Flow Failed");
    }
}

onreply_route {
#!ifdef WITH_HOMER
    if ($env(HOMER_NODE_NAME) != $null && $env(HOMER_NODE_NAME) != "") {
        sip_trace("", "$env(HOMER_NODE_NAME)");
    } else {
        sip_trace();
    }
#!endif

    if (nat_uac_test("19")) {
        set_contact_alias();
    }

#!ifdef WITH_RTPENGINE
    if (has_body("application/sdp")) {
        route(RTPENGINE_ANSWER);
    }
#!endif
}

#!ifdef WITH_PROMETHEUS
event_route[xhttp:request] {
    if ($hu == "/metrics") {
        prom_check_uri();
        prom_dispatch();
        return;
    }
    xhttp_reply("404", "Not Found", "", "");
}
#!endif
