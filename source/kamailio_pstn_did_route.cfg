# tenant_did_map.cfg
# Entrada esperada: $var(did) ya seteado (por ejemplo con $rU o $tU)

route[DID_TO_SETID] {
    # Tenant A: 01177660010..19
    if ($var(did) =~ "^0117766001[0-9]$") {
        $var(setid) = 10;
        return 1;
    }

    # Tenant B: 01177660020..29
    if ($var(did) =~ "^0117766002[0-9]$") {
        $var(setid) = 20;
        return 1;
    }

    return -1;
}
