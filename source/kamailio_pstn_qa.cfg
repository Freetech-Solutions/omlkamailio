#!KAMAILIO
#
# ============================================================================
#  kamailio_pstn_qa.cfg  —  SBC PSTN + inyección SIP de error por prefijo (QA)
# ============================================================================
#
#  ROL
#    Misma lógica que kamailio_pstn.cfg (SBC entre ITSP y cluster ACD), más
#    respuestas SIP sintéticas en OUTBOUND según el prefijo del user-part del
#    R-URI ($rU). Pensado para test-env / debugging; no usar en producción.
#
#  FLUJOS
#    INBOUND  (ITSP -> Kamailio -> ACD):  igual que kamailio_pstn.cfg.
#    OUTBOUND (ACD -> Kamailio -> ITSP):  primero route[QA_SIP_ERROR_PREFIX];
#             si no matchea, topomask + relay al carrier (RELAY_ITSP).
#    IN-DIALOG: igual que kamailio_pstn.cfg.
#
#  TRATAMIENTO POR PREFIJO del user-part del R-URI ($rU) en OUTBOUND:
#    081*  -> 480 Temporarily Unavailable
#    082*  -> 487 Request Terminated
#    083*  -> 488 Not Acceptable Here
#    084*  -> 500 Internal Server Error
#    085*  -> 502 Bad Gateway
#    086*  -> 608 Rejected
#    087*  -> 180 Ringing 45s, luego 408 Request Timeout
#    092*  -> 404 Not Found
#    093*  -> 503 Service Unavailable
#    094*  -> 486 Busy Here
#    095*  -> 603 Decline
#    096*  -> 403 Forbidden
#    097*  -> 405 Method Not Allowed
#    098*  -> 406 Not Acceptable
#    099*  -> 408 Request Timeout
#    otro  -> relay hacia ITSP (comportamiento normal del SBC)
#
#  DISCRIMINACIÓN DE DIRECCIÓN (seguridad por IP de origen)
#    - IS_FROM_ITSP  -> origen en la allowlist del carrier  -> INBOUND
#    - ds_is_from_list(DS_ACD_SETID) -> origen es un nodo del cluster -> OUTBOUND
#    - cualquier otro origen -> 403 Forbidden (protege a los nodos internos).
# ============================================================================

# ---------------------------------------------------------------------------
#  Sustitución de variables de entorno (resueltas al cargar el script)
# ---------------------------------------------------------------------------
#!substdef "!IPADDR_PUBLIC!$env(IPADDR_PUBLIC)!g"
#!substdef "!IPADDR_PRIVATE!$env(IPADDR_PRIVATE)!g"
#!substdef "!MY_FQDN!$env(FQDN)!g"
#!substdef "!MY_DOMAIN!$env(DOMAIN)!g"
#!substdef "!RTPENGINE_SOCKET!$env(RTPENGINE_SOCKET)!g"
#!substdef "!KAMAILIO_CERTS_LOCATION!$env(KAMAILIO_CERTS_LOCATION)!g"

#!substdef "!MY_UDP_PORT!5060!g"
#!substdef "!MY_TLS_PORT!5061!g"

# Interfaces lógicas de RTPengine (Single-Homed: IP Única)
#!substdef "!RTP_IFACE_PUB!external!g"
#!substdef "!RTP_IFACE_PRIV!internal!g"

# Homer (sólo se usan si WITH_HOMER está definido).
#!substdef "!HOMER_CAPTURE_HOST!$env(HOMER_HOST)!g"
#!substdef "!HOMER_CAPTURE_PORT!$env(HOMER_PORT)!g"
#!substdef "!HOMER_CAPTURE_ID!$env(HOMER_CAPTURE_ID)!g"

# ---------------------------------------------------------------------------
#  Flags de compilación condicional
# ---------------------------------------------------------------------------
#!define WITH_NAT
#!define WITH_RTPENGINE
#!define WITH_DISPATCHER
#!define WITH_PROMETHEUS

# Set del dispatcher que agrupa a los nodos ACD
#!define DS_ACD_SETID 10

# Flags de mensaje/branch.
#!define FLT_NATS 5
#!define FLB_NATB 6
#!define FLB_HOMER 24

####### Global Parameters #########
debug=2
log_stderror=yes
log_facility=LOG_LOCAL0
fork=yes
children=4

mhomed=yes
force_rport=yes
tcp_connection_lifetime=300
alias=MY_FQDN
alias=MY_DOMAIN

#!ifdef WITH_PROMETHEUS
tcp_accept_no_cl=yes
#!endif

####### Listen Sockets #########
listen=udp:IPADDR_PUBLIC:MY_UDP_PORT advertise IPADDR_PUBLIC:MY_UDP_PORT
listen=udp:IPADDR_PRIVATE:MY_UDP_PORT

#!ifdef WITH_TLS
listen=tls:IPADDR_PUBLIC:MY_TLS_PORT advertise IPADDR_PUBLIC:MY_TLS_PORT
#!endif

#!ifdef WITH_PROMETHEUS
listen=tcp:IPADDR_PRIVATE:9273
#!endif

####### Modules #########
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "async.so"
loadmodule "sl.so"
loadmodule "kex.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "sanity.so"
loadmodule "xlog.so"
loadmodule "uac.so"
loadmodule "ipops.so"

#!ifdef WITH_DISPATCHER
loadmodule "dispatcher.so"
#!endif

#!ifdef WITH_NAT
loadmodule "nathelper.so"
#!endif

#!ifdef WITH_RTPENGINE
loadmodule "rtpengine.so"
#!endif

#!ifdef WITH_TLS
loadmodule "tls.so"
#!endif

#!ifdef WITH_HOMER
loadmodule "siptrace.so"
#!endif

#!ifdef WITH_PROMETHEUS
loadmodule "xhttp.so"
loadmodule "xhttp_prom.so"
#!endif

####### Module Parameters #########

# --- tm ---
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 120000) # FIX: Optimizado para colas de espera masivas

# --- async (087: 180 + espera 45s + 408) ---
modparam("async", "workers", 2)

# --- rr ---
modparam("rr", "enable_double_rr", 1)
modparam("rr", "append_fromtag", 1)
modparam("rr", "enable_full_lr", 1)

# --- uac ---
modparam("uac", "restore_mode", "auto")

#!ifdef WITH_DISPATCHER
# --- dispatcher ---
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "xavp_dst", "_dsdst_")
modparam("dispatcher", "xavp_ctx", "_dsctx_")
modparam("dispatcher", "ds_ping_interval", 15)
modparam("dispatcher", "ds_ping_from", "sip:proxy@MY_FQDN")
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_reply_codes", "class=2;code=480;code=486;code=603")
#!endif

#!ifdef WITH_NAT
# --- nathelper ---
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
#!endif

#!ifdef WITH_RTPENGINE
# --- rtpengine ---
modparam("rtpengine", "rtpengine_sock", "RTPENGINE_SOCKET")
#!endif

#!ifdef WITH_TLS
# --- tls ---
modparam("tls", "certificate", "KAMAILIO_CERTS_LOCATION/cert.pem")
modparam("tls", "private_key", "KAMAILIO_CERTS_LOCATION/key.pem")
modparam("tls", "ca_list", "KAMAILIO_CERTS_LOCATION/ca.pem")
#!endif

#!ifdef WITH_HOMER
# --- siptrace ---
modparam("siptrace", "trace_to_database", 0)
modparam("siptrace", "duplicate_uri", "sip:HOMER_CAPTURE_HOST:HOMER_CAPTURE_PORT")
modparam("siptrace", "hep_mode_on", 1)
modparam("siptrace", "hep_version", 3)
modparam("siptrace", "hep_capture_id", HOMER_CAPTURE_ID)
modparam("siptrace", "trace_on", 1)
modparam("siptrace", "trace_flag", FLB_HOMER)
#!endif

include_file "/etc/kamailio/itsp_allowlist.cfg"

# ===========================================================================
#  REQUEST ROUTE — punto de entrada
# ===========================================================================
request_route {

    route(REQINIT);

#!ifdef WITH_HOMER
    route(SIPTRACE_HOMER);
#!endif

    route(NATMANAGE);

    if (is_method("CANCEL")) {
        if (t_check_trans()) route(RELAY);
        exit;
    }

    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    if (t_check_trans()) exit;

    if (!is_method("INVITE|REGISTER|SUBSCRIBE|MESSAGE|OPTIONS|INFO|REFER")) {
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }

    # 7a. INBOUND: Carrier -> Kamailio -> ACD
    if (route(IS_FROM_ITSP)) {
        xlog("L_INFO", "INBOUND  ITSP $si:$sp -> ACD  $rm RURI=$ru Call-ID=$ci\n");
        route(INBOUND_TO_ACD);
        exit;
    }

    #!ifdef WITH_DISPATCHER
    # 7b. OUTBOUND: ACD (Host) -> Kamailio -> ITSP
    if (ds_is_from_list(DS_ACD_SETID)) {
        xlog("L_INFO", "OUTBOUND ACD $si:$sp -> ITSP $rm Call-ID=$ci\n");
        route(OUTBOUND_TO_ITSP);
        exit;
    }
    #!endif

    xlog("L_WARN", "RECHAZADO origen no autorizado $si:$sp $rm Call-ID=$ci\n");
    sl_send_reply("403", "Forbidden");
    exit;
}

# ===========================================================================
#  INBOUND: ITSP -> dispatcher -> clúster ACD
# ===========================================================================
route[INBOUND_TO_ACD] {
    if ($rU == $null) {
        sl_send_reply("484", "Address Incomplete");
        exit;
    }

#!ifdef WITH_DISPATCHER
    $var(setid) = DS_ACD_SETID;
    if (!ds_select_dst("$var(setid)", "4")) {
        xlog("L_ERR", "INBOUND sin nodos ACD activos. Call-ID=$ci\n");
        sl_send_reply("503", "No ACD nodes available");
        exit;
    }
    force_send_socket(udp:IPADDR_PRIVATE:MY_UDP_PORT);
#!else
    $du = $ru;
#!endif

    # enable_double_rr: 2 RR if WAN≠LAN sockets, 1 RR if single-homed
    record_route();

    if (is_method("INVITE") && has_body("application/sdp")) {
        route(RTPENGINE_OFFER);
    }

    t_on_branch("MANAGE_BRANCH");
    t_on_failure("MANAGE_FAILURE");
    t_on_reply("MANAGE_REPLY");
    route(RELAY);
    exit;
}

# ===========================================================================
#  OUTBOUND: nodo ACD -> enmascaramiento -> carrier ITSP
# ===========================================================================
route[OUTBOUND_TO_ITSP] {
    # QA: inyección de errores SIP por prefijo (antes de media/topomask/relay)
    route(QA_SIP_ERROR_PREFIX);

    if (is_present_hf("Route")) {
        route(RESOLVE_OUTBOUND_ROUTE);
        if ($var(nexthop) == $null || $var(nexthop) == "") {
            xlog("L_ERR", "OUTBOUND no se pudo resolver next-hop. Call-ID=$ci\n");
            sl_send_reply("500", "Routing Error");
            exit;
        }
        $du = $var(nexthop);
        remove_hf("Route");
    } else {
        if ($rU == $null) {
            sl_send_reply("484", "Address Incomplete");
            exit;
        }
        $du = $ru;
    }

    force_send_socket(udp:IPADDR_PUBLIC:MY_UDP_PORT);
    route(TOPOMASK_ITSP);
    record_route();

    if (is_method("INVITE") && has_body("application/sdp")) {
        route(RTPENGINE_OFFER);
    }

    t_on_reply("MANAGE_REPLY");
    t_on_failure("MANAGE_FAILURE");
    route(RELAY_ITSP);
    exit;
}

route[WITHINDLG_FIX_RURI_FOR_ACD] {
    if ($rm == "BYE" || $rm == "CANCEL") {
        if ($fu != $null && $fu != "") {
            $ru = $fu;
            return;
        }
    }
    if ($tu == $null || $tu == "") return;
    $ru = $tu;
    return;
}

route[WITHINDLG_NEED_ACD_DST] {
    if (is_ip_rfc1918("$rd") || $rd == "IPADDR_PRIVATE" || is_ip_rfc1918("$(du{uri.host})")) {
        return 1;
    }
    if (is_myself("$rd") || is_myself("$(du{uri.host})") || $rd == "IPADDR_PUBLIC") {
        return 1;
    }
    if ($rd == "MY_FQDN" || $rd == "IPADDR_PUBLIC") {
        return 1;
    }
    return -1;
}

route[WITHINDLG_ROUTE_TO_ACD] {
#!ifdef WITH_DISPATCHER
    if (ds_is_from_list(DS_ACD_SETID)) return;
#!endif
    if (route(WITHINDLG_NEED_ACD_DST) < 0) return;

    $var(setid) = DS_ACD_SETID;
    if (!ds_select_dst("$var(setid)", "4")) {
        xlog("L_ERR", "WITHINDLG_ROUTE_TO_ACD: sin ACD disponible Call-ID=$ci RURI=$ru rd=$rd du=$du\n");
        return;
    }

    route(WITHINDLG_FIX_RURI_FOR_ACD);
    xlog("L_INFO", "WITHINDLG_ROUTE_TO_ACD: $rm src=$si:$sp Call-ID=$ci RURI=$ru -> ACD $du (rd=$rd)\n");
    return;
}

# ===========================================================================
#  IN-DIALOG: Control de Diálogos Activos
# ===========================================================================
route[WITHINDLG] {
    if (!loose_route()) {
        if (is_method("ACK")) {
            if (t_check_trans()) route(RELAY);
            exit;
        }
#!ifdef WITH_DISPATCHER
        if (is_method("BYE") && route(IS_FROM_ITSP) && route(WITHINDLG_NEED_ACD_DST) > 0) {
            $var(setid) = DS_ACD_SETID;
            if (ds_select_dst("$var(setid)", "4")) {
                route(WITHINDLG_FIX_RURI_FOR_ACD);
                xlog("L_WARN", "WITHINDLG: BYE sin loose_route, relay ACD $du RURI=$ru Call-ID=$ci\n");
                force_send_socket(udp:IPADDR_PRIVATE:MY_UDP_PORT);
#!ifdef WITH_RTPENGINE
                rtpengine_delete();
#!endif
                route(RELAY);
                exit;
            }
        }
#!endif
        xlog("L_ERR", "WITHINDLG loose_route() falló $rm src=$si:$sp RURI=$ru "
                      "Route=$hdr(Route) Record-Route=$hdr(Record-Route) Call-ID=$ci\n");
        sl_send_reply("404", "Not Here");
        exit;
    }

    # FIX: Removida la llamada incondicional duplicada de handle_ruri_alias()
    handle_ruri_alias();

    route(WITHINDLG_ROUTE_TO_ACD);

    if (route(IS_FROM_ITSP)) {
        force_send_socket(udp:IPADDR_PRIVATE:MY_UDP_PORT);
        xlog("L_INFO", "WITHINDLG: $rm hacia ACD/privado du=$du RURI=$ru Call-ID=$ci\n");
    } else if (ds_is_from_list(DS_ACD_SETID)) {
        force_send_socket(udp:IPADDR_PUBLIC:MY_UDP_PORT);
        route(TOPOMASK_ITSP);
        xlog("L_INFO", "WITHINDLG: $rm hacia carrier/publico du=$du RURI=$ru Call-ID=$ci\n");
    }

    if (is_method("INVITE|UPDATE") && has_body("application/sdp")) {
        route(RTPENGINE_OFFER);
    }
    if (is_method("BYE")) {
#!ifdef WITH_RTPENGINE
        rtpengine_delete();
#!endif
    }

    t_on_reply("MANAGE_REPLY");
    route(RELAY);
    exit;
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

route[RELAY_ITSP] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# ===========================================================================
#  QA: respuestas SIP sintéticas por prefijo R-URI (outbound only)
# ===========================================================================
route[QA_SIP_ERROR_PREFIX] {
    if ($rU == $null || $rU == "") return;

    # 092* -> Not Found
    if ($rU =~ "^092") {
        xlog("L_INFO", "QA prefix 092 -> 404 Not Found user=$rU Call-ID=$ci\n");
        sl_send_reply("404", "Not Found");
        exit;
    }

    # 093* -> Service Unavailable
    if ($rU =~ "^093") {
        xlog("L_INFO", "QA prefix 093 -> 503 Service Unavailable user=$rU Call-ID=$ci\n");
        sl_send_reply("503", "Service Unavailable");
        exit;
    }

    # 094* -> Busy Here
    if ($rU =~ "^094") {
        xlog("L_INFO", "QA prefix 094 -> 486 Busy Here user=$rU Call-ID=$ci\n");
        sl_send_reply("486", "Busy Here");
        exit;
    }

    # 095* -> Decline
    if ($rU =~ "^095") {
        xlog("L_INFO", "QA prefix 095 -> 603 Decline user=$rU Call-ID=$ci\n");
        sl_send_reply("603", "Decline");
        exit;
    }

    # 096* -> Forbidden
    if ($rU =~ "^096") {
        xlog("L_INFO", "QA prefix 096 -> 403 Forbidden user=$rU Call-ID=$ci\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }

    # 097* -> Method Not Allowed
    if ($rU =~ "^097") {
        xlog("L_INFO", "QA prefix 097 -> 405 Method Not Allowed user=$rU Call-ID=$ci\n");
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }

    # 098* -> Not Acceptable
    if ($rU =~ "^098") {
        xlog("L_INFO", "QA prefix 098 -> 406 Not Acceptable user=$rU Call-ID=$ci\n");
        sl_send_reply("406", "Not Acceptable");
        exit;
    }

    # 099* -> Request Timeout
    if ($rU =~ "^099") {
        xlog("L_INFO", "QA prefix 099 -> 408 Request Timeout user=$rU Call-ID=$ci\n");
        sl_send_reply("408", "Request Timeout");
        exit;
    }

    # 081* -> Temporarily Unavailable
    if ($rU =~ "^081") {
        xlog("L_INFO", "QA prefix 081 -> 480 Temporarily Unavailable user=$rU Call-ID=$ci\n");
        sl_send_reply("480", "Temporarily Unavailable");
        exit;
    }

    # 082* -> Request Terminated
    if ($rU =~ "^082") {
        xlog("L_INFO", "QA prefix 082 -> 487 Request Terminated user=$rU Call-ID=$ci\n");
        sl_send_reply("487", "Request Terminated");
        exit;
    }

    # 083* -> Not Acceptable Here
    if ($rU =~ "^083") {
        xlog("L_INFO", "QA prefix 083 -> 488 Not Acceptable Here user=$rU Call-ID=$ci\n");
        sl_send_reply("488", "Not Acceptable Here");
        exit;
    }

    # 084* -> Internal Server Error
    if ($rU =~ "^084") {
        xlog("L_INFO", "QA prefix 084 -> 500 Internal Server Error user=$rU Call-ID=$ci\n");
        sl_send_reply("500", "Internal Server Error");
        exit;
    }

    # 085* -> Bad Gateway
    if ($rU =~ "^085") {
        xlog("L_INFO", "QA prefix 085 -> 502 Bad Gateway user=$rU Call-ID=$ci\n");
        sl_send_reply("502", "Bad Gateway");
        exit;
    }

    # 086* -> Rejected
    if ($rU =~ "^086") {
        xlog("L_INFO", "QA prefix 086 -> 608 Rejected user=$rU Call-ID=$ci\n");
        sl_send_reply("608", "Rejected");
        exit;
    }

    # 087* -> 180 Ringing 45s, then 408 Request Timeout (INVITE only)
    if ($rU =~ "^087") {
        if (!is_method("INVITE")) return;
        xlog("L_INFO", "QA prefix 087 -> 180 Ringing 45s then 408 user=$rU Call-ID=$ci\n");
        if (!t_newtran()) {
            sl_reply_error();
            exit;
        }
        t_reply("180", "Ringing");
        if (!async_route("QA_087_TIMEOUT", "45")) {
            xlog("L_ERR", "QA prefix 087 async_route failed, sending 408 now Call-ID=$ci\n");
            t_reply("408", "Request Timeout");
        }
        exit;
    }

    return;
}

route[QA_087_TIMEOUT] {
    xlog("L_INFO", "QA prefix 087 timeout -> 408 Request Timeout Call-ID=$ci\n");
    t_reply("408", "Request Timeout");
    exit;
}

# ===========================================================================
#  HELPER ROUTES
# ===========================================================================
route[REQINIT] {
    if (!mf_process_maxfwd_header("70")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("1511", "7")) {
        exit;
    }

    if (is_method("OPTIONS") && uri == myself) {
        sl_send_reply("200", "OK");
        exit;
    }
}

route[NATMANAGE] {
#!ifdef WITH_NAT
#!ifdef WITH_DISPATCHER
    if (ds_is_from_list(DS_ACD_SETID)) return;
#!endif
    if (is_ip_rfc1918("$si")) return;

    if (nat_uac_test("19")) {
        force_rport();
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else {
            fix_nated_contact();
            if (is_first_hop()) {
                set_contact_alias();
            }
        }
        setflag(FLT_NATS);
    }
#!endif
    return;
}

route[RESOLVE_OUTBOUND_ROUTE] {
    $var(nexthop) = "";
    $var(r1) = $(hdr(Route){re.subst,/<([^>]+)>.*/\1/});

    $var(r2) = "";
    if ($hdrc(Route) > 1) {
        $var(r2) = $(hdr(Route)[1]{re.subst,/<([^>]+)>.*/\1/});
    }

    if (is_myself($var(r1))) {
        # Asterisk suele insertar Route(s) hacia este proxy; si todos apuntan
        # a nosotros (p. ej. duplicados), el destino real está en el RURI.
        if ($var(r2) != "" && !is_myself($var(r2))) {
            $var(nexthop) = $var(r2);
        } else {
            $var(nexthop) = $ru;
        }
    } else {
        $var(nexthop) = $var(r1);
    }
    return;
}

route[TOPOMASK_ITSP] {
    if (is_present_hf("OMniLeadsOutbound")) {
        remove_hf("OMniLeadsOutbound");
    }

    if ($fU != $null && $fU != "") {
        $var(pubuser) = $fU;
    } else {
        $var(pubuser) = "oml";
    }

    remove_hf("Contact");
    insert_hf("Contact: <sip:$var(pubuser)@IPADDR_PUBLIC:MY_UDP_PORT>\r\n", "Call-ID");

    if (!has_totag()) {
        if (!uac_replace_from("", "sip:" + $var(pubuser) + "@IPADDR_PUBLIC")) {
            xlog("L_WARN", "TOPOMASK uac_replace_from falló Call-ID=$ci\n");
        }
    }
    return;
}

#!ifdef WITH_HOMER
route[SIPTRACE_HOMER] {
    if (is_method("OPTIONS")) return;
    setflag(FLB_HOMER);
    t_set_fr(0, 0);

    if ($env(HOMER_NODE_NAME) != $null && $env(HOMER_NODE_NAME) != "") {
        sip_trace("", "$env(HOMER_NODE_NAME)");
    } else {
        sip_trace();
    }
    return;
}
#!endif

# ===========================================================================
#  RTPengine — Configuración Plana Single-Homed (IP Única)
# ===========================================================================
# ===========================================================================
#  RTPengine — Bridge de media de doble cara (external <-> internal)
# ===========================================================================
route[RTPENGINE_OFFER] {
#!ifdef WITH_RTPENGINE
    # Flags base: siempre confiar en el SDP original (Asterisk o Carrier) y forzar RTP plano
    $var(reflags) = "trust-address replace-origin replace-session-connection ICE=remove RTP/AVP";

    # Lógica de doble cara: definimos las interfaces según el origen de la llamada
    if (route(IS_FROM_ITSP)) {
        # INBOUND: Viene del ITSP (Externa) hacia el ACD (Interna)
        # RTPengine escuchará en la pública y enviará hacia la privada
        $var(reflags) = $var(reflags) + " direction=external direction=internal";
    } else {
        # OUTBOUND: Viene del ACD (Interna) hacia el ITSP (Externa)
        # RTPengine escuchará en la privada y enviará hacia la pública
        $var(reflags) = $var(reflags) + " direction=internal direction=external";
    }

    # Si hay NAT detectado, forzamos reescritura
    if (nat_uac_test("8")) {
        $var(reflags) = $var(reflags)
            + " force-replace-origin force-replace-session-connection";
    }

    if (!rtpengine_offer("$var(reflags)")) {
        xlog("L_ERR", "RTPengine OFFER error Call-ID=$ci\n");
    }
#!endif
    return;
}

route[RTPENGINE_ANSWER] {
#!ifdef WITH_RTPENGINE
    # En la respuesta, RTPengine ya tiene amarrada la sesión a las interfaces correctas
    # que le pasamos en el OFFER, por lo que solo enviamos las flags base.
    $var(reflags) = "trust-address replace-origin replace-session-connection ICE=remove RTP/AVP";
    
    if (nat_uac_test("8")) {
        $var(reflags) = $var(reflags)
            + " force-replace-origin force-replace-session-connection";
    }
    
    if (!rtpengine_answer("$var(reflags)")) {
        xlog("L_ERR", "RTPengine ANSWER error Call-ID=$ci\n");
    }
#!endif
    return;
}
# ===========================================================================
#  BRANCH ROUTE 
# ===========================================================================
branch_route[MANAGE_BRANCH] {
    xlog("L_INFO", "BRANCH -> $ru ($du) Call-ID=$ci\n");
    force_send_socket(udp:IPADDR_PRIVATE:MY_UDP_PORT);
    route(NATMANAGE);
}

# ===========================================================================
#  ONREPLY ROUTE
# ===========================================================================
onreply_route[MANAGE_REPLY] {
#!ifdef WITH_HOMER
    if ($env(HOMER_NODE_NAME) != $null && $env(HOMER_NODE_NAME) != "") {
        sip_trace("", "$env(HOMER_NODE_NAME)");
    } else {
        sip_trace();
    }
#!endif

#!ifdef WITH_NAT
    if (nat_uac_test("19")) {
        set_contact_alias();
    }
#!endif

#!ifdef WITH_RTPENGINE
    if (has_body("application/sdp")) {
        route(RTPENGINE_ANSWER);
    }
#!endif
}

# ===========================================================================
#  FAILURE ROUTE — Failover dinámico del clúster ACD
# ===========================================================================
failure_route[MANAGE_FAILURE] {
#!ifdef WITH_RTPENGINE
    if (is_method("INVITE")) {
        rtpengine_delete();
    }
#!endif

#!ifdef WITH_DISPATCHER
    if (route(IS_FROM_ITSP) && (t_branch_timeout() || t_check_status("5[0-9][0-9]"))) {
        if (ds_next_dst()) {
            xlog("L_INFO", "FAILOVER -> siguiente nodo ACD $du Call-ID=$ci\n");
            force_send_socket(udp:IPADDR_PRIVATE:MY_UDP_PORT);
            route(NATMANAGE);
            
            # Aquí la oferta SDP se recalcula obligatoriamente para el nuevo nodo
            if (is_method("INVITE") && has_body("application/sdp")) {
                route(RTPENGINE_OFFER);
            }
            t_on_branch("MANAGE_BRANCH");
            t_on_failure("MANAGE_FAILURE");
            t_on_reply("MANAGE_REPLY");
            route(RELAY);
            exit;
        }
        xlog("L_ERR", "FAILOVER agotado: sin más nodos ACD. Call-ID=$ci\n");
        t_reply("503", "Service Unavailable");
        exit;
    }
#!endif
}

#!ifdef WITH_PROMETHEUS
event_route[xhttp:request] {
    if ($hu == "/metrics") {
        prom_check_uri();
        prom_dispatch();
        exit;
    }
    xhttp_reply("404", "Not Found", "text/plain", "Not Found");
}
#!endif
